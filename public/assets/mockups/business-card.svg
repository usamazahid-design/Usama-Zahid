<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#222226"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bgLight)"/>
  <!-- Dark marble surface grid lines -->
  <line x1="0" y1="650" x2="1200" y2="650" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  <!-- Minimalist Business Card Stock -->
  <g transform="translate(300, 240) rotate(-4 300 210)" filter="url(#cardShadow)">
    <rect width="600" height="350" rx="4" fill="#FDFDFD"/>
    <!-- Subtle tactile paper grain -->
    <rect width="600" height="350" rx="4" fill="#000000" opacity="0.02"/>
    <!-- Card blind deboss inner safe zone -->
    <rect x="20" y="20" width="560" height="310" rx="2" fill="none" stroke="#000000" stroke-opacity="0.03" stroke-width="1"/>
  </g>
</svg>
