<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="facadeGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#28282D"/>
      <stop offset="100%" stop-color="#121215"/>
    </radialGradient>
    <filter id="signShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#facadeGrad)"/>
  <!-- Concrete architecture seam lines -->
  <line x1="200" y1="0" x2="200" y2="900" stroke="#000000" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="1000" y1="0" x2="1000" y2="900" stroke="#000000" stroke-opacity="0.4" stroke-width="2"/>
  <!-- Modern Acrylic Plaque with metal standoff mounts -->
  <g transform="translate(240, 200)" filter="url(#signShadow)">
    <!-- Frosted glass plate -->
    <rect width="720" height="420" rx="8" fill="#FFFFFF" fill-opacity="0.94"/>
    <rect width="720" height="420" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2"/>
    <!-- 4 Standoff Pegs in corners -->
    <circle cx="36" cy="36" r="12" fill="#D0D0D4" stroke="#606068" stroke-width="2"/>
    <circle cx="684" cy="36" r="12" fill="#D0D0D4" stroke="#606068" stroke-width="2"/>
    <circle cx="36" cy="384" r="12" fill="#D0D0D4" stroke="#606068" stroke-width="2"/>
    <circle cx="684" cy="384" r="12" fill="#D0D0D4" stroke="#606068" stroke-width="2"/>
  </g>
</svg>
