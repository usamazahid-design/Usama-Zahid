<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="deskGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1E22"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </radialGradient>
    <filter id="sheetShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#deskGrad)"/>
  <!-- Pen accessory on desk -->
  <rect x="940" y="220" width="16" height="420" rx="8" fill="#2C2C32" stroke="#444450" stroke-width="1"/>
  <rect x="944" y="240" width="8" height="60" fill="#D4AF37"/>
  <!-- A4 Letterhead sheet -->
  <g transform="translate(340, 90)" filter="url(#sheetShadow)">
    <rect width="520" height="720" rx="2" fill="#FFFFFF"/>
    <!-- Subtle top header divider -->
    <line x1="40" y1="130" x2="480" y2="130" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
    <!-- Simulated document lines -->
    <rect x="40" y="160" width="160" height="10" fill="#000000" opacity="0.12"/>
    <rect x="40" y="200" width="440" height="6" fill="#000000" opacity="0.07"/>
    <rect x="40" y="216" width="440" height="6" fill="#000000" opacity="0.07"/>
    <rect x="40" y="232" width="380" height="6" fill="#000000" opacity="0.07"/>
    <rect x="40" y="260" width="440" height="6" fill="#000000" opacity="0.07"/>
    <rect x="40" y="276" width="420" height="6" fill="#000000" opacity="0.07"/>
    <rect x="40" y="292" width="290" height="6" fill="#000000" opacity="0.07"/>
    <!-- Bottom footer address -->
    <line x1="40" y1="670" x2="480" y2="670" stroke="#000000" stroke-opacity="0.06" stroke-width="0.8"/>
    <rect x="40" y="682" width="180" height="5" fill="#000000" opacity="0.08"/>
  </g>
</svg>
